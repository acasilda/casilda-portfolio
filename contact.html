<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description"
      content="Contact Your Name through the accessible portfolio contact form.">

<meta name="author" content="Casilda A">

<meta name="robots"
      content="index, follow">

<title>Casilda A | Computer Science Portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>

    <header role="banner">

        <nav aria-label="Main navigation">

            <h1>My Portfolio</h1>

            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>
            </ul>

        </nav>

    </header>

    <main id="main-content">

        <section aria-labelledby="contact-title">

            <h2 id="contact-title">Contact Me</h2>

            <form
    action="#"
    method="post"
    aria-label="Contact form">

                <div>
                    <label for="name">
    Full Name
</label>

<input
    type="text"
    id="name"
    name="name"
    autocomplete="name"
    required
    aria-required="true">
                </div>

                <div>
                    <label for="email">
    Email Address
</label>

<input
    type="email"
    id="email"
    name="email"
    autocomplete="email"
    required
    aria-required="true">
                </div>

                <div>
                    <label for="message">
    Message
</label>

<textarea
    id="message"
    name="message"
    rows="6"
    required
    aria-required="true"></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer role="contentinfo">

        <p>&copy; 2026 My Portfolio</p>

    </footer>

</body>

</html>
